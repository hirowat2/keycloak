[project]
name = "commercialproposal"
version = "0.1.0"
description = "Controle de propostas comerciais: clientes, catálogo, funil de propostas, aprovação de descontos e indicadores."
authors = [{ name = "Faendaaa", email = "lucas.carotta@outlook.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pseudoproject @ git+https://github.com/Estatcamp/PseudoProject.git@master",
  "django-jazzmin (>=3.0.1,<4.0.0)",
  "django-extensions (>=4.1,<5.0)",
  "psycopg2-binary (>=2.9.11,<3.0.0)",
  "weasyprint (>=68.1,<69.0)",
  "openpyxl (>=3.1.5,<4.0.0)",
  "pyjwt[crypto] (>=2.10.1,<3.0.0)",
  "requests (>=2.32.3,<3.0.0)",
  "pypdf (>=6.0.0,<7.0.0)",
]

[tool.poetry]
packages = [{ include = "commercial", from = "src" }, { include = "proposal", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
snakeviz = "^2.2.2"
pip-licenses = "^5.0.0"
mypy = "^1.15.0"
radon = "5.1"
django-stubs = { extras = ["compatible-mypy"], version = "^5.2.0" }
pylint = "^3.3.7"
pytest-django = "^4.12.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "proposal.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.django-stubs]
django_settings_module = "proposal.settings"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
