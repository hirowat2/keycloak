apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    allow.http: "false"
    application: keycloak
spec:
  # Para escalar, basta aumentar: o Keycloak 26 descobre os outros pods pelo banco (JDBC_PING)
  replicas: 1
  selector:
    matchLabels:
      application: keycloak
  template:
    metadata:
      labels:
        application: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          # --import-realm só cria os realms de /opt/keycloak/data/import que ainda não existem no banco
          args: ["start", "--import-realm"]
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secrets
          env:
            - name: KC_DB
              value: postgres
            # TLS termina no Traefik; o Keycloak fala HTTP na 8080
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # Health/metrics ficam na porta de gerenciamento (9000)
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    application: keycloak
spec:
  selector:
    application: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
# Só HTTPS: o Keycloak (sslRequired=external) recusa login vindo de fora por HTTP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: default
spec:
  rules:
    # Substituído pelo KC_HOSTNAME de k8s/config.env (replacements no kustomization.yaml)
    - host: KC_HOSTNAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
