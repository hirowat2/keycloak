# CommercialProposal no Kubernetes. Aplicar com "make k8s-deploy" (ver documents/controle_de_acesso.md, seção 6).
#
# Configuração do pod (em chave repetida, vale a última):
#   1. commercialproposal-config  (abaixo)  — endereços e opções, sem segredo
#   2. commercialproposal-segredos (Secret) — senhas e o segredo do SharePoint; criar à mão, fora do repositório
# Os e-mails que podem entrar ficam fixos no código (EMAILS_PERMITIDOS em src/proposal/sso.py).
#
# Os valores marcados com AJUSTAR dependem do cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: commercialproposal-config
  labels:
    application: commercialproposal
data:
  DEBUG: "false"                  # gunicorn
  RUN_MAKEMIGRATIONS: "0"         # em produção só aplica as migrações versionadas
  GUNICORN_WORKERS: "3"
  GUNICORN_TIMEOUT: "600"
  HOST: "https://propostas.estatcamp.com.br"                          # AJUSTAR
  KEYCLOAK_HOST: "https://keycloak.estatcamp.com.br/"                  # AJUSTAR: o endereço do "iss" dos tokens
  KEYCLOAK_INTERNAL_URL: ""                                            # AJUSTAR: Service do Keycloak no cluster, se houver
  KEYCLOAK_REALM: "commercialproposal"
  KEYCLOAK_CLIENT_ID: "commercialproposal"
  DJANGO_DATABASE_ENGINE: "postgresql"
  DJANGO_DATABASE_HOST: "postgres"                                     # AJUSTAR
  DJANGO_DATABASE_PORT: "5432"
  DJANGO_DATABASE_NAME: "commercialproposal"
  DJANGO_DATABASE_USERNAME: "postgres"                                 # AJUSTAR
  SHAREPOINT_TENANT_ID: "22f0fb2c-0638-4944-be79-9e94ac853bcc"
  SHAREPOINT_CLIENT_ID: "0fdf864b-0de0-4070-a6a9-5e7c88faa0f1"
  SHAREPOINT_INTERVALO_MINUTOS: "60"                                  # sincronização automática; 0 desliga
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commercialproposal
  labels:
    application: commercialproposal
spec:
  replicas: 1
  selector:
    matchLabels:
      application: commercialproposal
  template:
    metadata:
      labels:
        application: commercialproposal
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: commercialproposal
          image: estat/commercialproposal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: commercialproposal-config
            - secretRef:
                name: commercialproposal-segredos
                optional: true
          startupProbe:                   # a inicialização roda collectstatic e migrate
            httpGet:
              path: /health/
              port: 80
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/
              port: 80
            periodSeconds: 30
          securityContext:
            privileged: false
---
apiVersion: v1
kind: Service
metadata:
  name: commercialproposal
  labels:
    application: commercialproposal
spec:
  selector:
    application: commercialproposal
  ports:
    - port: 80
      targetPort: 80
