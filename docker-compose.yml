services:
  # ------------------------------------------------ ASSISTENTE --------------------------------------------------------
  # App Django que aplica os passos do README_sso.md e do README_migracao_vm.md pela Admin API do Keycloak.

  assistente:
    hostname: assistente
    build:
      context: .
      # Token das dependências privadas do GitHub; não fica gravado na imagem.
      secrets:
        - github_pat
    restart: on-failure
    env_file:
      - path: .env
        required: false
    environment:
      # General
      - DEBUG=true
      - GUNICORN_WORKERS=3
      - GUNICORN_TIMEOUT=600
      - DJANGO_SUPERUSER_USERNAME=estatcamp
      - DJANGO_SUPERUSER_PASSWORD=estatcamp
      - DJANGO_SUPERUSER_EMAIL=estatcamp@estatcamp.com.br
      - HOST=https://${ASSISTENTE_HOST:-keycloak-assistente.docker.localhost}
      # Django DB
      - DJANGO_DATABASE_ENGINE=postgresql
      - DJANGO_DATABASE_HOST=assistente-db
      - DJANGO_DATABASE_NAME=assistente
      - DJANGO_DATABASE_USERNAME=postgres
      - DJANGO_DATABASE_PASSWORD=${ASSISTENTE_DB_PASSWORD:-estatcamp}
      - DJANGO_DATABASE_PORT=5432
      # Login no assistente: client "keycloak-assistente" do realm KC_REALM (o entrypoint cria se faltar)
      - KEYCLOAK_HOST=https://${KC_HOST:-keycloak.docker.localhost}/
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=${KC_REALM:-automateflow}
      - KEYCLOAK_CLIENT_ID=keycloak-assistente
      # Admin API: o admin do realm master, o mesmo do console
      - KEYCLOAK_ADMIN_USER=${KC_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-admin}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak-assistente.tls=true
      - traefik.http.routers.keycloak-assistente.rule=Host(`keycloak-assistente.docker.localhost`)
    volumes:
      - ./src:/usr/src/src
      - ./media:/usr/src/media
    networks:
      - default
      - proxy
    depends_on:
      assistente-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  assistente-db:
    image: postgres:17-alpine
    restart: on-failure
    environment:
      - POSTGRES_DB=assistente
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${ASSISTENTE_DB_PASSWORD:-estatcamp}
    volumes:
      - assistente-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assistente"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=false
    networks:
      - default

  # ------------------------------------------------- KEYCLOAK ---------------------------------------------------------

  keycloak:
    hostname: keycloak
    image: quay.io/keycloak/keycloak:26.8.1
    # --import-realm só cria os realms de ./realm que ainda não existem no banco
    command: start --import-realm
    restart: on-failure
    env_file:
      - path: .env
        required: false
    environment:
      # Admin do realm master (só é criado no primeiro boot, com o banco vazio)
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-admin}
      # Banco
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      - KC_DB_USERNAME=${KC_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:-keycloak}
      # Atrás do Traefik: TLS termina no proxy, o Keycloak fala HTTP na 8080.
      # O back-channel (http://keycloak:8080) continua funcionando para os apps da rede proxy.
      - KC_HOSTNAME=https://${KC_HOST:-keycloak.docker.localhost}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_LOG_LEVEL=${KC_LOG_LEVEL:-info}
      # Um nó só: sem cluster. Senão, a cada container novo (ou dump restaurado) o Keycloak gasta ~20 s
      # tentando entrar no "cluster" do nó antigo registrado no banco (JDBC_PING) antes de subir.
      - KC_CACHE=local
      # Usados como placeholders em realm/*.json
      - KC_REALM=${KC_REALM:-automateflow}
      - KC_REALM_ADMIN_USER=${KC_REALM_ADMIN_USER:-admin}
      - KC_REALM_ADMIN_PASSWORD=${KC_REALM_ADMIN_PASSWORD:-admin}
      - ATLAS_INSIGHTS_URL=${ATLAS_INSIGHTS_URL:-https://atlas-insights.docker.localhost}
      - LINODE_INSIGHTS_URL=${LINODE_INSIGHTS_URL:-https://linode-insights.docker.localhost}
      - MONGO_MIGRATOR_URL=${MONGO_MIGRATOR_URL:-https://mongo-migrator.docker.localhost}
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    # Health fica na porta de gerenciamento (9000); a imagem não tem curl
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.rule=Host(`${KC_HOST:-keycloak.docker.localhost}`)
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    networks:
      - default
      - proxy
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    hostname: keycloak-db
    image: postgres:17-alpine
    restart: on-failure
    environment:
      - POSTGRES_DB=${KC_DB_NAME:-keycloak}
      - POSTGRES_USER=${KC_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=false
    # Os bancos ficam só na rede da stack, fora da "proxy" compartilhada com outros projetos
    networks:
      - default

  # Só sobe com `--profile traefik` (ou `make compose` quando não há Traefik nas portas 80/443).
  # Usa a mesma config local de ~/.traefik e ~/.certs dos outros projetos.
  reverse-proxy:
    image: traefik:3.7.1
    profiles: [traefik]
    security_opt:
      - no-new-privileges:true
    restart: on-failure
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.certs:/etc/certs:ro
      - ${HOME}/.traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${HOME}/.traefik/config.yml:/etc/traefik/config.yml:ro
    networks:
      - proxy

#  NETWORK -----------------------------------------------------------

networks:
  default:
  proxy:
    external: true

secrets:
  github_pat:
    environment: GITHUB_PAT

volumes:
  assistente-db:
  keycloak-db:
